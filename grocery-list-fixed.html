<title>רשימת קניות משותפת</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');
:root {
  --bg:#F7F8FA; --surface:#fff; --border:#E4E7ED;
  --text-main:#1A1D23; --text-sub:#7A8099;
  --accent:#3B6FE8; --accent-light:#EEF3FD;
  --need:#E84C3B; --need-light:#FEF0EE;
  --ok:#22C55E; --ok-light:#F0FDF4;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;direction:rtl;overscroll-behavior:none;}

/* ROOM SCREEN */
.room-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg);}
.room-logo{font-size:48px;margin-bottom:10px;}
.room-title{font-size:24px;font-weight:700;margin-bottom:6px;text-align:center;}
.room-sub{font-size:14px;color:var(--text-sub);margin-bottom:28px;text-align:center;line-height:1.6;max-width:320px;}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:380px;margin-bottom:14px;}
.room-card h3{font-size:15px;font-weight:600;margin-bottom:12px;}
.room-input-row{display:flex;gap:8px;}
.room-input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:15px;direction:ltr;color:var(--text-main);background:var(--bg);}
.room-input:focus{outline:none;border-color:var(--accent);}
.room-input::placeholder{color:var(--text-sub);direction:rtl;}
.room-btn{padding:11px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;}
.room-hint{font-size:12px;color:var(--text-sub);margin-top:10px;line-height:1.5;}
.room-divider{display:flex;align-items:center;gap:10px;margin:4px 0;width:100%;max-width:380px;}
.room-divider::before,.room-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.room-divider span{font-size:12px;color:var(--text-sub);}
.saved-rooms{width:100%;max-width:380px;margin-top:6px;}
.saved-rooms h4{font-size:13px;color:var(--text-sub);font-weight:500;margin-bottom:8px;}
.saved-room-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;font-family:'Heebo',sans-serif;font-size:14px;cursor:pointer;color:var(--text-main);}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;}
.header-inner{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.header-left{display:flex;align-items:center;gap:8px;min-width:0;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-family:'Heebo',sans-serif;font-size:13px;cursor:pointer;color:var(--text-sub);flex-shrink:0;}
.room-badge{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-light);padding:4px 10px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;direction:ltr;}
.sync-badge{font-size:12px;color:var(--text-sub);display:flex;align-items:center;gap:5px;flex-shrink:0;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background 0.3s;}
.sync-dot.live{background:var(--ok);}

/* SEARCH BAR */
.search-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;}
.search-inner{max-width:600px;margin:0 auto;position:relative;}
.search-input{width:100%;padding:9px 36px 9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:14px;direction:rtl;background:var(--bg);color:var(--text-main);}
.search-input:focus{outline:none;border-color:var(--accent);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.search-clear{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-sub);display:none;}

.main{max-width:600px;margin:0 auto;padding:16px 16px 120px;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);font-family:'Heebo',sans-serif;font-size:14px;font-weight:500;color:var(--text-sub);cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab .count{display:inline-block;background:rgba(255,255,255,0.25);border-radius:10px;padding:0 6px;font-size:12px;margin-right:4px;}
.tab:not(.active) .count{background:var(--bg);color:var(--text-sub);}

/* FILTER + CLEAR BAR */
.action-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
.toggle-filter{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--need);cursor:pointer;background:var(--need-light);padding:6px 12px;border-radius:20px;border:none;font-family:'Heebo',sans-serif;white-space:nowrap;}
.toggle-filter.off{color:var(--text-sub);background:var(--bg);border:1.5px solid var(--border);}
.clear-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ok);cursor:pointer;background:var(--ok-light);padding:6px 12px;border-radius:20px;border:none;font-family:'Heebo',sans-serif;white-space:nowrap;}

/* CATEGORY */
.category-section{margin-bottom:18px;}
.category-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--border);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;user-select:none;}
.category-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.category-actions{display:flex;align-items:center;gap:8px;}
.need-count{font-size:12px;background:var(--need);color:#fff;border-radius:10px;padding:1px 8px;font-weight:600;}
.chevron{font-size:11px;color:var(--text-sub);transition:transform 0.2s;}
.chevron.open{transform:rotate(180deg);}
.items-list{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;}

/* ITEM ROW */
.item-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);transition:background 0.12s;}
.item-row:last-child{border-bottom:none;}
.item-row.needs-buy{background:var(--need-light);}
.item-row.bought{background:var(--ok-light);opacity:0.7;}

.need-toggle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all 0.15s;background:var(--surface);}
.need-toggle.active{border-color:var(--need);background:var(--need);color:#fff;}
.need-toggle.bought-check{border-color:var(--ok);background:var(--ok);color:#fff;}

.item-info{flex:1;min-width:0;cursor:pointer;}
.item-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-name.strikethrough{text-decoration:line-through;color:var(--text-sub);}
.item-sub{font-size:12px;color:var(--text-sub);margin-top:1px;}
.item-sub.urgent{color:var(--need);font-weight:600;}
.item-note{font-size:11px;color:var(--accent);margin-top:3px;font-style:italic;display:block;}
.item-recurring{font-size:10px;color:var(--text-sub);margin-top:1px;}

.item-controls{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.qty-group{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);}
.qty-btn{width:30px;height:32px;border:none;background:transparent;font-size:18px;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
.qty-btn:active{background:var(--accent-light);}
.qty-input{width:36px;height:32px;border:none;border-right:1px solid var(--border);border-left:1px solid var(--border);background:transparent;font-family:'Heebo',sans-serif;font-size:14px;font-weight:600;text-align:center;color:var(--text-main);direction:ltr;-moz-appearance:textfield;}
.qty-input::-webkit-inner-spin-button,.qty-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.qty-input:focus{outline:none;background:var(--accent-light);}
.unit-select{padding:4px 2px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:11px;color:var(--text-sub);background:var(--bg);cursor:pointer;max-width:50px;}
.unit-select:focus{outline:none;border-color:var(--accent);}
.delete-btn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text-sub);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.delete-btn:active{background:var(--need-light);color:var(--need);}

.add-item-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px dashed var(--border);background:var(--surface);}
.add-item-input{flex:1;border:none;background:transparent;font-family:'Heebo',sans-serif;font-size:14px;color:var(--text-main);direction:rtl;}
.add-item-input::placeholder{color:var(--text-sub);}
.add-item-input:focus{outline:none;}
.add-item-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}

/* SHOPPING MODE BANNER */
.shopping-banner{display:none;background:var(--ok);color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:600;position:sticky;top:57px;z-index:90;}
.shopping-banner.active{display:block;}

/* LIVE CHANGE BANNER */
.live-banner{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--accent);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:250;transition:transform 0.3s;white-space:nowrap;pointer-events:none;}
.live-banner.show{transform:translateX(-50%) translateY(0);}

/* FAB area */
.fab-area{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 40%);padding:16px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:50;}
.fab-row{display:flex;gap:10px;align-items:center;}
.fab{background:var(--accent);color:#fff;border:none;border-radius:28px;padding:13px 22px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(59,111,232,0.35);white-space:nowrap;}
.fab:active{opacity:0.88;}
.fab-secondary{background:var(--surface);color:var(--text-main);border:1.5px solid var(--border);border-radius:28px;padding:11px 18px;font-family:'Heebo',sans-serif;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}
.fab-secondary.shopping-mode{color:var(--ok);border-color:var(--ok);background:var(--ok-light);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:22px 20px 36px;width:100%;max-width:600px;direction:rtl;max-height:85vh;overflow-y:auto;}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:13px;font-weight:500;color:var(--text-sub);margin-bottom:6px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:15px;color:var(--text-main);background:var(--bg);direction:rtl;}
.modal-field textarea{resize:none;height:72px;}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{outline:none;border-color:var(--accent);}
.modal-checkbox{display:flex;align-items:center;gap:10px;padding:10px 0;}
.modal-checkbox input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn-primary{flex:1;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
.btn-secondary{padding:13px 20px;background:var(--bg);color:var(--text-main);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:15px;font-weight:500;cursor:pointer;}
.btn-danger{padding:13px 20px;background:var(--need-light);color:var(--need);border:1.5px solid var(--need);border-radius:var(--radius-sm);font-family:'Heebo',sans-serif;font-size:15px;font-weight:500;cursor:pointer;}

/* TOAST */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--text-main);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:300;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-sub);font-size:14px;}
.empty-state .icon{font-size:36px;margin-bottom:8px;}
.loading{text-align:center;padding:60px 20px;color:var(--text-sub);font-size:15px;}
</style>
</head>
<body>

<!-- ROOM SCREEN -->
<div id="room-screen" class="room-screen">
  <div class="room-logo">🛒</div>
  <div class="room-title">רשימת קניות משותפת</div>
  <div class="room-sub">הזן קוד חדר משותף עם בן/בת הזוג.<br>כל משפחה — קוד נפרד משלה.</div>
  <div class="room-card">
    <h3>קוד חדר</h3>
    <div class="room-input-row">
      <input class="room-input" id="room-code-input" type="text" placeholder="למשל: family123" onkeydown="if(event.key==='Enter') joinRoom()">
      <button class="room-btn" onclick="joinRoom()">כניסה</button>
    </div>
    <div class="room-hint">💡 שתף את הקוד רק עם מי שרוצה לגשת לאותה רשימה.</div>
  </div>
  <div class="room-divider"><span>או</span></div>
  <div id="saved-rooms-section" class="saved-rooms" style="display:none">
    <h4>חדרים אחרונים</h4>
    <div id="saved-rooms-list"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen" style="display:none">
  <header>
    <div class="header-inner">
      <div class="header-left">
        <button class="back-btn" onclick="leaveRoom()">← חדרים</button>
        <div class="room-badge" id="current-room-badge"></div>
      </div>
      <div class="sync-badge">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">מתחבר...</span>
      </div>
    </div>
  </header>

  <div class="shopping-banner" id="shopping-banner">🛒 מצב קניות פעיל — סמן פריטים שנכנסו לעגלה ✓</div>

  <div class="search-bar">
    <div class="search-inner">
      <input class="search-input" id="search-input" type="text" placeholder="חיפוש פריט..." oninput="onSearch(this.value)">
      <span class="search-icon" id="search-icon">🔍</span>
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div class="action-bar">
      <button class="toggle-filter off" id="filter-btn" onclick="toggleFilter()">🔴 חסר בבית</button>
      <button class="clear-btn" id="clear-btn" onclick="clearAllNeeds()" style="display:none">✅ ניקוי לאחר קניות</button>
    </div>
    <div id="list-container"><div class="loading">טוען...</div></div>
  </div>

  <div class="fab-area">
    <div class="fab-row">
      <button class="fab-secondary" id="shopping-mode-btn" onclick="toggleShoppingMode()">🛒 מצב קניות</button>
      <button class="fab" onclick="openAddModal()">+ הוסף פריט</button>
    </div>
  </div>
</div>

<!-- Live change banner -->
<div class="live-banner" id="live-banner"></div>

<!-- Add/Edit Item Modal -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <h2 id="modal-title">הוסף פריט חדש</h2>
    <div class="modal-field">
      <label>קטגוריה</label>
      <select id="modal-cat" onchange="onCatChange()"></select>
    </div>
    <div id="new-cat-field" style="display:none">
      <div class="modal-field">
        <label>שם קטגוריה חדשה</label>
        <input id="modal-new-cat-name" type="text" placeholder="לדוגמה: אורגני...">
      </div>
      <div class="modal-field">
        <label>אמוג׳י</label>
        <input id="modal-new-cat-emoji" type="text" placeholder="🥦" style="max-width:80px">
      </div>
    </div>
    <div class="modal-field">
      <label>שם הפריט</label>
      <input id="modal-name" type="text" placeholder="לדוגמה: חלב, לחם, עגבניות...">

      <label>יחידת מידה</label>
      <select id="modal-unit">
        <option value="יח׳">יחידות (יח׳)</option>
        <option value="גרם">גרם</option>
        <option value="ק״ג">קילוגרם</option>
        <option value="מ״ל">מיליליטר</option>
        <option value="ליטר">ליטר</option>
        <option value="קופסה">קופסה</option>
        <option value="חבילה">חבילה</option>
        <option value="כוס">כוס</option>
        <option value="כיכר">כיכר</option>
        <option value="בקבוק">בקבוק</option>
      </select>
    </div>
    <div class="modal-field">
      <label>הערה (אופציונלי)</label>
      <textarea id="modal-note" placeholder="לדוגמה: מותג X בלבד, 3% שומן..."></textarea>
    </div>
    <div class="modal-checkbox">
      <input type="checkbox" id="modal-recurring">
      <label for="modal-recurring" style="font-size:14px;color:var(--text-main);margin:0">🔁 פריט קבוע (חוזר אוטומטית לרשימה)</label>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveModal()">שמור</button>
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn-danger" id="modal-delete-btn" style="display:none" onclick="deleteFromModal()">מחק</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase compat SDK — plain globals, no type="module", works with inline onclick on iPhone Safari

const firebaseConfig = {
  apiKey: "AIzaSyAjAdani2XSSpSYIg7r12YgVjgNKHe1KCo",
  authDomain: "grocery-list-b6925.firebaseapp.com",
  databaseURL: "https://grocery-list-b6925-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "grocery-list-b6925",
  storageBucket: "grocery-list-b6925.firebasestorage.app",
  messagingSenderId: "41069876879",
  appId: "1:41069876879:web:7c9834ec315abe5e8a82fa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── STATE ──
let currentRoom = null;
let state = { categories:[], items:[], collapsed:{} };
let activeTab = 'all';
let showNeedOnly = false;
let shoppingMode = false;
let searchQuery = '';
let unsubscribe = null;
let roomRefGlobal = null;
let editingItemId = null;
let prevItemIds = null;
let migrationDone = false;

const DEFAULT_DATA = {
  categories:[
    {id:'cat1',name:'ירקות ופירות',emoji:'🥦'},
    {id:'cat2',name:'מוצרי חלב',emoji:'🥛'},
    {id:'cat3',name:'מאפים',emoji:'🍞'},
    {id:'cat4',name:'בשר ודגים',emoji:'🥩'},
    {id:'cat5',name:'מזון יבש',emoji:'🛒'},
    {id:'cat6',name:'ניקיון',emoji:'🧹'},
  ],
  items:[
    {id:'i1', catId:'cat1',name:'עגבניות',    unit:'ק״ג', qty:1,  need:false,note:'',recurring:false,bought:false},
    {id:'i2', catId:'cat1',name:'מלפפון',     unit:'ק״ג', qty:1,  need:false,note:'',recurring:false,bought:false},
    {id:'i3', catId:'cat1',name:'בצל',        unit:'ק״ג', qty:1,  need:false,note:'',recurring:false,bought:false},
    {id:'i4', catId:'cat1',name:'תפוחים',     unit:'ק״ג', qty:1,  need:false,note:'',recurring:false,bought:false},
    {id:'i5', catId:'cat1',name:'בננות',      unit:'יח׳', qty:6,  need:false,note:'',recurring:false,bought:false},
    {id:'i6', catId:'cat2',name:'חלב',        unit:'ליטר',qty:2,  need:false,note:'',recurring:true, bought:false},
    {id:'i7', catId:'cat2',name:'גבינה צהובה',unit:'גרם', qty:200,need:false,note:'',recurring:false,bought:false},
    {id:'i8', catId:'cat2',name:'יוגורט',     unit:'יח׳', qty:4,  need:false,note:'',recurring:false,bought:false},
    {id:'i9', catId:'cat2',name:'חמאה',       unit:'גרם', qty:100,need:false,note:'',recurring:false,bought:false},
    {id:'i10',catId:'cat3',name:'לחם',        unit:'כיכר',qty:1,  need:false,note:'',recurring:true, bought:false},
    {id:'i11',catId:'cat4',name:'עוף',        unit:'ק״ג', qty:1,  need:false,note:'',recurring:false,bought:false},
    {id:'i12',catId:'cat4',name:'בשר טחון',   unit:'גרם', qty:500,need:false,note:'',recurring:false,bought:false},
    {id:'i13',catId:'cat5',name:'פסטה',       unit:'חבילה',qty:2, need:false,note:'',recurring:false,bought:false},
    {id:'i14',catId:'cat5',name:'אורז',       unit:'ק״ג', qty:1,  need:false,note:'',recurring:false,bought:false},
    {id:'i15',catId:'cat5',name:'שמן זית',    unit:'בקבוק',qty:1, need:false,note:'',recurring:false,bought:false},
    {id:'i16',catId:'cat6',name:'נוזל כלים',  unit:'יח׳', qty:1,  need:false,note:'',recurring:true, bought:false},
    {id:'i17',catId:'cat6',name:'נייר טואלט', unit:'חבילה',qty:1, need:false,note:'',recurring:true, bought:false},
  ],
  collapsed:{}
};

// ── SAVED ROOMS ──
function getSavedRooms(){try{return JSON.parse(localStorage.getItem('saved_rooms')||'[]');}catch{return[];}}
function saveRoomLocal(code){let r=getSavedRooms().filter(x=>x.code!==code);r.unshift({code,ts:Date.now()});localStorage.setItem('saved_rooms',JSON.stringify(r.slice(0,5)));}
function renderSavedRooms(){
  const rooms=getSavedRooms();
  const sec=document.getElementById('saved-rooms-section');
  const list=document.getElementById('saved-rooms-list');
  if(!rooms.length){sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML=rooms.map(r=>`<button class="saved-room-btn" onclick="window.joinRoomByCode('${r.code}')"><span style="font-weight:600">🏠 ${r.code}</span><span style="font-size:12px;color:var(--text-sub)">כניסה ←</span></button>`).join('');
}

// ── ROOM JOIN ──
window.joinRoom=function(){
  const code=document.getElementById('room-code-input').value.trim().toLowerCase().replace(/\s+/g,'-');
  if(!code){showToast('⚠️ נא להזין קוד חדר');return;}
  window.joinRoomByCode(code);
};
window.joinRoomByCode=async function(code){
  currentRoom=code; saveRoomLocal(code);
  document.getElementById('room-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('current-room-badge').textContent='🏠 '+code;
  setSyncStatus('connecting');
  // Detach previous listener before switching rooms
  if(unsubscribe&&roomRefGlobal){roomRefGlobal.off('value',unsubscribe);unsubscribe=null;}
  const roomRef=db.ref('rooms/'+code);
  roomRefGlobal=roomRef;
  const snap=await roomRef.get();
  if(!snap.exists()) await roomRef.set(DEFAULT_DATA);
  unsubscribe=roomRef.on('value',snapshot=>{
    const data=snapshot.val();
    if(data){
      // Use Object.entries so the Firebase key is the authoritative id
      const rawItems=data.items?Object.entries(data.items).map(([key,val])=>({...val,id:key})):[];
      // Deduplicate by id
      const seenIds=new Set();
      const dedupedItems=rawItems.filter(item=>{
        if(!item||!item.id||seenIds.has(item.id)) return false;
        seenIds.add(item.id); return true;
      });
      // Migration: fill missing fields for old items that pre-date new schema
      // Only run once per session (migrationDone flag prevents infinite onValue loops)
      if(!migrationDone){
        migrationDone=true;
        dedupedItems.forEach(item=>{
          const needsMigration=
            item.note===undefined||
            item.recurring===undefined||
            item.bought===undefined||
            item.id===undefined;
          if(needsMigration){
            const fixed={
              id:item.id||item.name,
              catId:item.catId||'cat1',
              name:item.name||'',
              unit:item.unit||'יח׳',
              qty:item.qty||1,
              need:item.need||false,
              note:item.note||'',
              recurring:item.recurring||false,
              bought:item.bought||false
            };
            db.ref('rooms/'+code+'/items/'+fixed.id).set(fixed);
            Object.assign(item,fixed);
          }
        });
      }
      const newItems=dedupedItems;
      // Detect additions by others
      if(prevItemIds!==null){
        newItems.forEach(item=>{
          if(!prevItemIds.has(item.id)) showLiveBanner('➕ נוסף: '+item.name);
        });
      }
      prevItemIds=new Set(newItems.map(i=>i.id));
      state={
        categories:data.categories?Object.values(data.categories):[],
        items:newItems,
        collapsed:data.collapsed||{}
      };
      render();
      setSyncStatus('live');
    }
  }, ()=>{ setSyncStatus('error'); });
};
window.leaveRoom=function(){
  if(unsubscribe&&roomRefGlobal){roomRefGlobal.off('value',unsubscribe);unsubscribe=null;roomRefGlobal=null;}
  currentRoom=null; activeTab='all'; showNeedOnly=false; shoppingMode=false; searchQuery=''; prevItemIds=null; migrationDone=false;
  document.getElementById('app-screen').style.display='none';
  document.getElementById('room-screen').style.display='flex';
  document.getElementById('room-code-input').value='';
  renderSavedRooms();
};

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot');
  const lbl=document.getElementById('sync-label');
  if(!navigator.onLine){
    dot.className='sync-dot';dot.style.background='var(--need)';
    lbl.textContent='אופליין — נתונים שמורים';lbl.style.color='var(--need)';
  } else if(s==='live'){
    dot.className='sync-dot live';dot.style.background='';
    lbl.textContent='מסונכרן';lbl.style.color='';
  } else if(s==='connecting'){
    dot.className='sync-dot';dot.style.background='';
    lbl.textContent='מתחבר...';lbl.style.color='';
  } else {
    dot.className='sync-dot';dot.style.background='';
    lbl.textContent='שגיאה';lbl.style.color='';
  }
}
window.addEventListener('online', ()=>setSyncStatus('live'));
window.addEventListener('offline',()=>setSyncStatus('offline'));

// ── FIREBASE WRITES ──
function dbRef(path){return db.ref('rooms/'+currentRoom+'/'+path);}
function uid(){return 'id_'+Math.random().toString(36).slice(2,9);}

window.toggleCollapse=function(catId){dbRef('collapsed').update({[catId]:!state.collapsed[catId]});};

window.toggleNeed=function(itemId){
  const item=state.items.find(i=>i.id===itemId);if(!item)return;
  const newVal=!item.need;
  dbRef('items/'+itemId).set({...item,need:newVal,bought:false});
  showToast(newVal?'🛒 '+item.name+' — צריך לקנות':'✅ '+item.name+' — הוסר מהחסרים');
};

window.toggleBought=function(itemId){
  const item=state.items.find(i=>i.id===itemId);if(!item)return;
  dbRef('items/'+itemId).set({...item,bought:!item.bought});
};

window.changeQty=function(itemId,delta){
  const item=state.items.find(i=>i.id===itemId);if(!item)return;
  const step=['גרם','מ״ל'].includes(item.unit)?50:1;
  const newQty=Math.max(0,parseFloat(item.qty)+delta*step);
  dbRef('items/'+itemId).set({...item,qty:parseFloat(newQty.toFixed(2))});
};
window.setQty=function(itemId,val){
  const item=state.items.find(i=>i.id===itemId);
  const p=parseFloat(val);
  if(item&&!isNaN(p)&&p>=0) dbRef('items/'+itemId).set({...item,qty:p});
};
window.updateUnit=function(itemId,val){
  const item=state.items.find(i=>i.id===itemId);
  if(item) dbRef('items/'+itemId).set({...item,unit:val});
};
window.deleteItem=function(itemId){
  const item=state.items.find(i=>i.id===itemId);
  dbRef('items/'+itemId).remove();
  if(item) showToast('🗑️ '+item.name+' נמחק');
};
window.addItemInline=function(catId,inputEl){
  const name=inputEl.value.trim();if(!name)return;
  const id=uid();
  dbRef('items/'+id).set({id,catId,name,unit:'יח׳',qty:1,need:false,note:'',recurring:false,bought:false});
  inputEl.value='';
  showToast('➕ '+name+' נוסף');
};

// Clear all "need" flags after shopping, restore recurring items
window.clearAllNeeds=function(){
  const updates={};
  state.items.forEach(item=>{
    if(item.need||item.bought){
      // recurring: clear bought only, keep need=true so they stay on the list
      // non-recurring: clear both need and bought
      updates[item.id]={...item,
        need: item.recurring ? true : false,
        bought: false
      };
    }
  });
  if(Object.keys(updates).length){
    Object.entries(updates).forEach(([id,val])=>dbRef('items/'+id).set(val));
  }
  const keptCount=state.items.filter(i=>i.recurring&&i.need).length;
  showToast('✅ הרשימה נוקתה!' + (keptCount>0?` ${keptCount} פריטים קבועים נשארו.`:''));
  showNeedOnly=false;
  document.getElementById('filter-btn').classList.add('off');
};

// ── SHOPPING MODE ──
window.toggleShoppingMode=function(){
  shoppingMode=!shoppingMode;
  document.getElementById('shopping-banner').classList.toggle('active',shoppingMode);
  const btn=document.getElementById('shopping-mode-btn');
  btn.classList.toggle('shopping-mode',shoppingMode);
  btn.textContent=shoppingMode?'✕ צא ממצב קניות':'🛒 מצב קניות';
  // In shopping mode, auto-show need-only
  if(shoppingMode&&!showNeedOnly){showNeedOnly=true;document.getElementById('filter-btn').classList.remove('off');}
  else if(!shoppingMode){showNeedOnly=false;document.getElementById('filter-btn').classList.add('off');}
  renderList();
};

// ── SEARCH ──
window.onSearch=function(val){
  searchQuery=val.trim();
  document.getElementById('search-clear').style.display=searchQuery?'block':'none';
  document.getElementById('search-icon').style.display=searchQuery?'none':'block';
  activeTab='all';
  renderTabs();
  renderList();
};
window.clearSearch=function(){
  document.getElementById('search-input').value='';
  window.onSearch('');
};

// ── FILTER ──
window.toggleFilter=function(){
  showNeedOnly=!showNeedOnly;
  document.getElementById('filter-btn').classList.toggle('off',!showNeedOnly);
  renderList();
};

// ── RENDER ──
function render(){
  renderTabs(); renderList();
  const anyNeed=state.items.some(i=>i.need);
  document.getElementById('clear-btn').style.display=anyNeed?'flex':'none';
}
function renderTabs(){
  const container=document.getElementById('tabs');
  const needAll=state.items.filter(i=>i.need).length;
  let html=`<button class="tab ${activeTab==='all'?'active':''}" onclick="setTab('all')">הכול <span class="count">${needAll>0?needAll:state.items.length}</span></button>`;
  state.categories.forEach(cat=>{
    const catItems=state.items.filter(i=>i.catId===cat.id);
    const needCount=catItems.filter(i=>i.need).length;
    const display=needCount>0?needCount:catItems.length;
    html+=`<button class="tab ${activeTab===cat.id?'active':''}" onclick="setTab('${cat.id}')">${cat.emoji} ${cat.name} <span class="count">${display}</span></button>`;
  });
  container.innerHTML=html;
}
window.setTab=function(id){activeTab=id;renderTabs();renderList();};

const ALL_UNITS=['יח׳','גרם','ק״ג','מ״ל','ליטר','קופסה','חבילה','כוס','כיכר','בקבוק'];

function renderList(){
  const container=document.getElementById('list-container');
  let cats=activeTab==='all'?state.categories:state.categories.filter(c=>c.id===activeTab);
  let html=''; let anyVisible=false;

  // Search mode: flat list
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    const matched=state.items.filter(i=>i.name.toLowerCase().includes(q)||( i.note&&i.note.toLowerCase().includes(q)));
    if(!matched.length){
      container.innerHTML=`<div class="empty-state"><div class="icon">🔍</div>לא נמצאו פריטים עבור "${searchQuery}"</div>`;
      return;
    }
    html='<div class="items-list" style="border-radius:var(--radius);border:1px solid var(--border)">';
    matched.forEach(item=>{ html+=renderItem(item); });
    html+='</div>';
    container.innerHTML=html; return;
  }

  cats.forEach(cat=>{
    let items=state.items.filter(i=>i.catId===cat.id);
    if(showNeedOnly) items=items.filter(i=>i.need||i.bought);
    if((showNeedOnly||shoppingMode)&&items.length===0) return;
    anyVisible=true;
    const needCount=state.items.filter(i=>i.catId===cat.id&&i.need).length;
    const isCollapsed=state.collapsed[cat.id];
    html+=`<div class="category-section">
      <div class="category-header" onclick="toggleCollapse('${cat.id}')">
        <div class="category-title"><span>${cat.emoji}</span>${cat.name}</div>
        <div class="category-actions">
          ${needCount>0?`<span class="need-count">${needCount} חסר</span>`:''}
          <span class="chevron ${isCollapsed?'':'open'}">▼</span>
        </div>
      </div>`;
    if(!isCollapsed){
      html+='<div class="items-list">';
      items.forEach(item=>{ html+=renderItem(item); });
      if(!showNeedOnly&&!shoppingMode){
        html+=`<div class="add-item-row">
          <input class="add-item-input" type="text" placeholder="+ הוסף פריט..." id="add_${cat.id}"
            onkeydown="if(event.key==='Enter') addItemInline('${cat.id}',this)">
          <button class="add-item-btn" onclick="addItemInline('${cat.id}',document.getElementById('add_${cat.id}'))">+</button>
        </div>`;
      }
      html+='</div>';
    }
    html+='</div>';
  });
  if(!anyVisible){
    html=`<div class="empty-state"><div class="icon">${showNeedOnly?'🎉':'📝'}</div>${showNeedOnly?'אין פריטים חסרים!<br><small>כל הכבוד 🏆</small>':'אין פריטים. לחץ + להוסיף'}</div>`;
  }
  container.innerHTML=html;
}

function renderItem(item){
  const unitOpts=ALL_UNITS.map(u=>`<option value="${u}" ${u===item.unit?'selected':''} >${u}</option>`).join('');
  const isBought=item.bought&&shoppingMode;
  return `<div class="item-row ${item.need&&!isBought?'needs-buy':''} ${isBought?'bought':''}" id="row_${item.id}">
    ${shoppingMode
      ?`<div class="need-toggle bought-check ${isBought?'bought-check':''}" style="${isBought?'border-color:var(--ok);background:var(--ok)':'border-color:var(--border);background:var(--surface)'}" onclick="toggleBought('${item.id}')">${isBought?'✓':''}</div>`
      :`<div class="need-toggle ${item.need?'active':''}" onclick="toggleNeed('${item.id}')">${item.need?'!':''}</div>`
    }
    <div class="item-info" onclick="openEditModal('${item.id}')">
      <div class="item-name ${isBought?'strikethrough':''}">${item.name}${item.recurring?'<span style="font-size:11px;color:var(--text-sub);margin-right:4px">🔁</span>':''}
      </div>
      <div class="item-sub ${item.need&&!isBought?'urgent':''}">${item.need&&!isBought?`צריך לקנות: ${item.qty} ${item.unit}`:`${item.qty} ${item.unit}`}</div>
      ${item.note?`<div class="item-note">📝 ${item.note}</div>`:''}
    </div>

    <div class="item-controls">
      <div class="qty-group">
        <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
        <input class="qty-input" type="number" value="${item.qty}" min="0" onchange="setQty('${item.id}',this.value)" onfocus="this.select()">
        <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
      </div>
      <select class="unit-select" onchange="updateUnit('${item.id}',this.value)">${unitOpts}</select>
      <button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>
    </div>
  </div>`;
}

// ── MODAL ──
window.openAddModal=function(){
  editingItemId=null;
  document.getElementById('modal-title').textContent='הוסף פריט חדש';
  document.getElementById('modal-delete-btn').style.display='none';
  const catSelect=document.getElementById('modal-cat');
  catSelect.innerHTML=state.categories.map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('')+`<option value="__new__">+ קטגוריה חדשה</option>`;
  document.getElementById('modal-name').value='';
  document.getElementById('modal-note').value='';
  document.getElementById('modal-recurring').checked=false;
  document.getElementById('modal-unit').value='יח׳';
  document.getElementById('new-cat-field').style.display='none';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('modal-name').focus(),120);
};

window.openEditModal=function(itemId){
  const item=state.items.find(i=>i.id===itemId);if(!item)return;
  editingItemId=itemId;
  document.getElementById('modal-title').textContent='עריכת פריט';
  const delBtn=document.getElementById('modal-delete-btn');
  delBtn.style.display='block';
  delBtn.dataset.itemId=itemId;
  const catSelect=document.getElementById('modal-cat');
  catSelect.innerHTML=state.categories.map(c=>`<option value="${c.id}" ${c.id===item.catId?'selected':''} >${c.emoji} ${c.name}</option>`).join('')+`<option value="__new__">+ קטגוריה חדשה</option>`;
  document.getElementById('modal-name').value=item.name;
  document.getElementById('modal-note').value=item.note||'';  document.getElementById('modal-recurring').checked=!!item.recurring;
  document.getElementById('modal-unit').value=item.unit;
  document.getElementById('new-cat-field').style.display='none';
  document.getElementById('modal').style.display='flex';
};

window.deleteFromModal=function(){
  const id=document.getElementById('modal-delete-btn').dataset.itemId;
  if(id){ deleteItem(id); closeModal(); }
};
window.onCatChange=function(){
  document.getElementById('new-cat-field').style.display=
    document.getElementById('modal-cat').value==='__new__'?'block':'none';
};
window.closeModal=function(e){
  if(!e||e.target.id==='modal') document.getElementById('modal').style.display='none';
};
window.saveModal=function(){
  const name=document.getElementById('modal-name').value.trim();
  if(!name){showToast('⚠️ נא להזין שם פריט');return;}
  let catId=document.getElementById('modal-cat').value;
  if(catId==='__new__'){
    const catName=document.getElementById('modal-new-cat-name').value.trim();
    const catEmoji=document.getElementById('modal-new-cat-emoji').value.trim()||'📦';
    if(!catName){showToast('⚠️ נא להזין שם קטגוריה');return;}
    catId=uid();
    dbRef('categories').update({[catId]:{id:catId,name:catName,emoji:catEmoji}});
  }
  const unit=document.getElementById('modal-unit').value;
  const note=document.getElementById('modal-note').value.trim();
  const recurring=document.getElementById('modal-recurring').checked;
  if(editingItemId){
    const existing=state.items.find(i=>i.id===editingItemId);
    dbRef('items/'+editingItemId).set({...existing,name,catId,unit,note,recurring});
    showToast('✏️ '+name+' עודכן');
  } else {
    const id=uid();
    dbRef('items/'+id).set({id,catId,name,unit,qty:1,need:false,note,recurring,bought:false});
    showToast('✅ '+name+' נוסף לרשימה');
  }
  document.getElementById('modal').style.display='none';
};

// ── TOAST & LIVE BANNER ──
let toastTimer;
window.showToast=function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
};
let liveBannerTimer;
function showLiveBanner(msg){
  const b=document.getElementById('live-banner');
  b.textContent=msg;b.classList.add('show');
  clearTimeout(liveBannerTimer);
  liveBannerTimer=setTimeout(()=>b.classList.remove('show'),3000);
}

renderSavedRooms();

// Register Service Worker for full offline support
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
